name: Offline source review
on:
  push:
    branches:
      - codex/offline-review-20261028
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EFNS_RUNTIME_MODE: local
      REPOSITORY_MODE: mock
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-review.txt
      - run: python scripts/check_review_package.py
      - run: python -m pytest -q --tb=short
      - run: python scripts/check_snowflake_readiness.py
